<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../static/bootstrap/bootstrap.4.6.min.css">
    <link rel="stylesheet" href="../static/css/init.css">
    <link rel="stylesheet" href="../static/fontawesome-free-7.1.0-web/css/all.min.css">
    <link rel="stylesheet" href="../static/css/forget_pwd.css">
    <link rel="icon" href="../static/photo/Web%20Q&A%20Logo.ico" type="image/x-icon">
    <script src="../static/js/forget_pwd.js"></script>
    <title>web问答平台 - 忘记密码</title>
</head>

<body>
<!-- 登录卡片主体 -->
<div class="login-card">
    <div class="row no-gutters">
        <!-- 左侧插图 -->
        <div class="col-md-5 illustration">
            <img src="../static/photo/login_logo.png" alt="登录插图" style="max-width: 300px;">
        </div>
        <!-- 右侧表单 -->
        <div class="col-md-7">
            <div class="login-header">
                <h1>找回密码</h1>
                <p>请输入您的注册邮箱以重置密码</p>
            </div>
            <div class="login-form">
                <form id="forget-pwd-form" method="POST" action="#">
                    <!-- 返回首页按钮 - 放在左上角 -->
                    <div class="back-home">
                        <a href="/">← 返回首页</a>
                    </div>

                    <!-- 邮箱输入 -->
                    <div class="form-group input-icon">
                        <i class="fas fa-envelope"></i>
                        <input type="email" class="form-control" placeholder="请输入邮箱" name="email" id="email-input"
                               required>
                    </div>

                    <!-- 获取邮箱验证码按钮 -->
                    <div class="form-group">
                        <div class="input-icon">
                            <i class="fas fa-key"></i>
                            <div class="captcha-container">
                                <input type="text" class="form-control" placeholder="请输入邮箱验证码"
                                       name="email_captcha" required>
                                <button type="button" class="btn btn-outline-secondary" id="send-captcha-btn">
                                    获取验证码
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- 新密码和确认密码 -->
                    <div class="form-group input-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" class="form-control" placeholder="请输入新密码" name="new_password"
                               required>
                    </div>

                    <!-- 提交按钮 -->
                    <button type="submit" class="btn btn-login">确定修改</button>
                </form>
            </div>
            <div class="footer">
                © 2026 WebProject | Contact: 759668915@qq.com | MadeBy: APguantou
            </div>
        </div>
    </div>
</div>
</body>
</html>
