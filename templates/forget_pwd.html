<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../static/bootstrap/bootstrap.4.6.min.css">
    <link rel="stylesheet" href="../static/css/init.css">
    <!-- 引入本地 Font Awesome -->
    <link rel="stylesheet" href="../static/fontawesome-free-7.1.0-web/css/all.min.css">
    <link rel="icon" href="../static/photo/Web%20Q&A%20Logo.ico" type="image/x-icon">
    <title>web问答平台 - 忘记密码</title>
    <style>
        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 800px;
            overflow: hidden;
        }

        .login-header {
            text-align: center;
            padding: 30px 20px;
        }

        .login-header h1 {
            font-size: 24px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .login-header p {
            color: #777;
            font-size: 14px;
        }

        .login-form {
            padding: 10px 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .input-icon {
            position: relative;
        }

        .input-icon i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
        }

        .form-control {
            padding-left: 40px;
            height: 46px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
        }

        .btn-login {
            background: #339dff;
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: 500;
            padding: 12px 0;
            font-size: 16px;
            width: 100%;
            margin-bottom: 10px;
        }

        .footer {
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: #666;
            background: #f8f9fa;
            border-top: 1px solid #eee;
        }

        .illustration {
            background: #f0f7ff;
            padding: 30px;
            display: flex;
            justify-content: center;
        }

        .illustration img {
            max-width: 100%;
            height: auto;
        }

        .links {
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
        }

        .links a {
            color: #3399ff;
            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .links div {
            margin: 0 10px;
        }

        .back-home {
            position: absolute;
            top: 20px;
            left: 30px;
            z-index: 10;
        }

        .back-home a {
            color: #333;
            text-decoration: none;
            font-size: 14px;
        }

        .back-home a:hover {
            text-decoration: underline;
        }

        .captcha-container {
            display: flex;
            gap: 10px;
        }

        .captcha-container input {
            flex: 1;
        }

        .captcha-container button {
            height: 46px;
        }

        .illustration img {
            width: 100%;
            max-width: 100%;
            height: auto;
            object-fit: contain; /* 保持横纵比，完整显示图片 */
        }
    </style>
</head>

<body>
<!-- 登录卡片主体 -->
<div class="login-card">
    <div class="row no-gutters">
        <!-- 左侧插图 -->
        <div class="col-md-5 illustration">
            <img src="../static/photo/login_logo.png" alt="登录插图" style="max-width: 300px;">
        </div>
        <!-- 右侧表单 -->
        <div class="col-md-7">
            <div class="login-header">
                <h1>找回密码</h1>
                <p>请输入您的注册邮箱以重置密码</p>
            </div>
            <div class="login-form">
                <form id="forget-pwd-form" method="POST" action="#">
                    <!-- 返回首页按钮 - 放在左上角 -->
                    <div class="back-home">
                        <a href="/">← 返回首页</a>
                    </div>

                    <!-- 邮箱输入 -->
                    <div class="form-group input-icon">
                        <i class="fas fa-envelope"></i>
                        <input type="email" class="form-control" placeholder="请输入邮箱" name="email" id="email-input"
                               required>
                    </div>

                    <!-- 获取邮箱验证码按钮 -->
                    <div class="form-group">
                        <div class="input-icon">
                            <i class="fas fa-key"></i>
                            <div class="captcha-container">
                                <input type="text" class="form-control" placeholder="请输入邮箱验证码"
                                       name="email_captcha" required>
                                <button type="button" class="btn btn-outline-secondary" id="send-captcha-btn">
                                    获取验证码
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- 新密码和确认密码 -->
                    <div class="form-group input-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" class="form-control" placeholder="请输入新密码" name="new_password"
                               required>
                    </div>

                    <!-- 提交按钮 -->
                    <button type="submit" class="btn btn-login">确定修改</button>
                </form>
            </div>
            <div class="footer">
                © 2026 WebProject | Contact: 759668915@qq.com | MadeBy: APguantou
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('forget-pwd-form').addEventListener('submit', function (event) {
        event.preventDefault(); // 阻止默认提交行为

        const email = document.getElementById('email-input').value;
        const email_captcha = document.querySelector('input[name="email_captcha"]').value;
        const new_password = document.querySelector('input[name="new_password"]').value;

        // 校验字段是否为空
        if (!email || !email_captcha || !new_password) {
            alert("请填写所有必填项");
            return;
        }

        // 发送请求到后端重置密码
        fetch('/auth/reset_pwd_cgw', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded'
            },
            body: `email=${encodeURIComponent(email)}&email_captcha=${encodeURIComponent(email_captcha)}&new_password=${encodeURIComponent(new_password)}`
        })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert("密码重置成功！");
                    window.location.href = "/auth/login_cgw"; // 跳转到登录页面
                } else {
                    alert(`重置失败：${data.message}`);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert("网络错误，请稍后再试");
            });
    });
    document.getElementById('send-captcha-btn').addEventListener('click', function () {
        const email = document.getElementById('email-input').value;
        if (!email) {
            alert("请输入邮箱地址");
            return;
        }

        fetch('/auth/send_email_captcha', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded'
            },
            body: `email=${encodeURIComponent(email)}`
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                if (data.success) {
                    alert("验证码已发送至您的邮箱，请查收");
                } else {
                    alert(`发送失败：${data.message}`);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert("网络错误，请稍后再试");
            });
    });
</script>
</body>

</html>
