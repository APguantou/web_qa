<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../static/bootstrap/bootstrap.4.6.min.css">
    <link rel="stylesheet" href="../static/css/init.css">
    <!-- 引入本地 Font Awesome -->
    <link rel="stylesheet" href="../static/fontawesome-free-7.1.0-web/css/all.min.css">
    <link rel="stylesheet" href="../static/css/login.css">
    <link rel="icon" href="../static/photo/Web%20Q&A%20Logo.ico" type="image/x-icon">

    <title>web问答平台 - 登录</title>
    <!-- 新增自定义样式 -->

</head>

<body>
<!-- 登录卡片主体 -->
<div class="login-card">
    <div class="row no-gutters">
        <!-- 左侧插图（可替换为实际图片） -->
        <div class="col-md-5 illustration">
            <img src="../static/photo/login_logo.png" alt="登录插图" style="max-width: 300px;">
        </div>
        <!-- 右侧表单 -->
        <div class="col-md-7">
            <div class="login-header">
                <h1>Web 问答平台 - 登录</h1>
                <p>一个简单、易用的问答平台</p>
            </div>
            <div class="login-form">
                <form action="#" method="POST">
                    <!-- 返回首页按钮 - 放在左上角 -->
                    <div class="back-home">
                        <a href="/">← 返回首页</a>
                    </div>

                    <div class="form-group input-icon">
                        <i class="fas fa-user"></i>
                        <input type="text" class="form-control" placeholder="请输入手机号或邮箱" name="email" required>
                    </div>
                    <div class="form-group input-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" class="form-control" placeholder="请输入登录密码" name="password"
                               required>
                    </div>

                    <!-- 记住用户名 + 忘记密码 + 立即注册 同一行 -->
                    <div class="remember-container">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="remember" name="remember">
                            <label class="form-check-label" for="remember">记住用户名</label>
                        </div>
                        <div class="links">
                            <a href="{{ url_for('auth.forget_pwd') }}">忘记密码？</a>
                            <div>|&nbsp</div>
                            <a href="{{ url_for('auth.register') }}">立即注册</a>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-login">登录</button>

                    <!-- 第三方登录 -->
                    <div class="social-login">
                        <div class="social-btn wechat-icon">
                            <i class="fab fa-weixin"></i> 微信登录
                        </div>
                        <div class="social-btn qq-icon">
                            <i class="fab fa-qq"></i> QQ登录
                        </div>
                    </div>
                </form>
            </div>
            <div class="footer">
                © 2026 WebProject | Contact: 759668915@qq.com | MadeBy: APguantou
            </div>
        </div>
    </div>
</div>

</body>

</html>
