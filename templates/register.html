<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../static/bootstrap/bootstrap.4.6.min.css">
    <link rel="stylesheet" href="../static/css/init.css">
    <!-- 引入本地 Font Awesome -->
    <link rel="stylesheet" href="../static/fontawesome-free-7.1.0-web/css/all.min.css">
    <link rel="stylesheet" href="../static/css/register.css"></link>
    <link rel="icon" href="../static/photo/Web%20Q&A%20Logo.ico" type="image/x-icon">
    <title>web问答平台 - 注册</title>
    <script src="{{ url_for('static', filename='jquery/jquery.3.6.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/register.js') }}"></script>

</head>
<body>
<!-- 在模板中显示错误信息 -->
{% if form_errors %}
    <div id="error-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>提示</h3>
            </div>
            <div class="modal-body">
                <ul>
                    {% for field, messages in form_errors.items() %}
                        {% for message in messages %}
                            <li>{{ message }}</li>
                        {% endfor %}
                    {% endfor %}
                </ul>
            </div>
            <div class="modal-footer">
                <button id="confirm-btn" class="btn btn-primary">确认</button>
            </div>
        </div>
    </div>
{% endif %}

<!-- 注册卡片主体 -->
<div class="register-card">
    <div class="row no-gutters">
        <!-- 左侧插图 -->
        <div class="col-md-5 illustration">
            <img src="../static/photo/login_logo.png" alt="注册插图" style="max-width: 300px;">
        </div>
        <!-- 右侧表单 -->
        <div class="col-md-7">
            <div class="register-header">
                <h1>Web 问答平台 - 登录</h1>
                <p>一个简单、易用的问答平台</p>
            </div>

            <div class="register-form">
                <form method="POST" action="#">
                    <!-- 返回首页按钮 - 放在左上角 -->
                    <div class="back-home">
                        <a href="/">← 返回首页</a>
                    </div>

                    <div class="form-group input-icon">
                        <i class="fas fa-envelope"></i>
                        <input type="email" class="form-control" placeholder="请输入邮箱" name="email" required>
                    </div>

                    <div class="form-group">
                        <div class="input-icon">
                            <i class="fas fa-key"></i>
                            <div class="captcha-container">
                                <input type="text" class="form-control" placeholder="请输入验证码" name="captcha"
                                       required>
                                <button class="btn btn-outline-secondary" type="button" id="captcha-btn">获取验证码
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="form-group input-icon">
                        <i class="fas fa-user"></i>
                        <input type="text" class="form-control" placeholder="请输入用户名" name="username" required>
                    </div>

                    <div class="form-group input-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" class="form-control" placeholder="请输入密码" name="password" required>
                    </div>

                    <div class="form-group input-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" class="form-control" placeholder="请确认密码" name="password_confirm"
                               required>
                    </div>

                    <!-- 登录 + 忘记密码 + 立即注册 链接行 -->
                    <div class="links">
                        <a href="{{ url_for('auth.login') }}">已有账号？立即登录</a>
                    </div>

                    <button type="submit" class="btn btn-register">注册</button>
                </form>
            </div>
            <div class="footer">
                © 2026 WebProject | Contact: 759668915@qq.com | MadeBy: APguantou
            </div>
        </div>
    </div>
</div>
</body>

</html>
